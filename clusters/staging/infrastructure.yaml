apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m
  timeout: 10m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-backups
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m
  timeout: 10m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/backups/staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
