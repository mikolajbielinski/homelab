apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 33
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.47.0
          envFrom:
            - secretRef:
                name: linkding-superuser
          ports:
            - containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: 9090
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 9090
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /
              port: 9090
            failureThreshold: 18
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data
