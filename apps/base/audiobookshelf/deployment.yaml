apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: audiobookshelf
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  strategy: {}
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      containers:
        - image: ghcr.io/advplyr/audiobookshelf:2.32.1
          name: audiobookshelf
          ports:
            - containerPort: 3005
          envFrom:
            - configMapRef:
                name: audiobookshelf-config
          volumeMounts:
            - mountsPath: /audiobooks
              name: audiobookshelf-storage
            - mountsPath: /podcasts
              name: audiobookshelf-storage
            - mountsPath: /config
              name: audiobookshelf-storage
            - mountsPath: /metadata
              name: audiobookshelf-storage
      volumes:
        - name: audiobookshelf-storage
          persistentVolumeClaim:
            claimName: audiobookshelf-storage
