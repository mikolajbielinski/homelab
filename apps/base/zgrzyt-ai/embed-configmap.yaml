apiVersion: v1
kind: ConfigMap
metadata:
  name: zgrzyt-embed-config
data:
  S3_BUCKET: "zgrzyt-ai"
  S3_PREFIX: "transcripts/labeled/"
  QDRANT_URL: "http://qdrant.zgrzyt-ai.svc.cluster.local:6333"
  COLLECTION_NAME: "zgrzyt-transcripts"
  CHUNK_MAX_TOKENS: "500"
  EMBEDDING_MODEL: "text-embedding-3-large"
  VECTOR_SIZE: "3072"
  EMBED_BATCH_SIZE: "100"
