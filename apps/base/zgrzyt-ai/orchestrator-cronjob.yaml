apiVersion: batch/v1
kind: CronJob
metadata:
  name: zgrzyt-orchestrator
spec:
  schedule: '*/15 * * * *'
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 172800
      activeDeadlineSeconds: 300
      backoffLimit: 2
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          containers:
            - name: orchestrator
              image: ghcr.io/mikolajbielinski/zgrzyt-orchestrator:main@sha256:b226717623ad07de0218385ed5888cd3b651f7914bdaed71e1bd54db1039a6f4
              envFrom:
                - configMapRef:
                    name: zgrzyt-orchestrator-config
                - secretRef:
                    name: orchestrator-secret
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
          imagePullSecrets:
            - name: ghcr-secret
