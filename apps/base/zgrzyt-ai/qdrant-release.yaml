apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
  namespace: zgrzyt-ai
spec:
  interval: 30m
  chart:
    spec:
      chart: qdrant
      version: '0.*'
      sourceRef:
        kind: HelmRepository
        name: qdrant
        namespace: zgrzyt-ai
      interval: 12h
  driftDetection:
    mode: enabled
  values:
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
