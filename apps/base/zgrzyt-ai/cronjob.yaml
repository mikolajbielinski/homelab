apiVersion: batch/v1
kind: CronJob
metadata:
  name: zgrzyt-download-newest
spec:
  schedule: '0 * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      name: zgrzyt-download-newest
    spec:
      template:
        spec:
          containers:
            - image: ghcr.io/mikolajbielinski/zgrzyt-download:latest
              name: zgrzyt-download-newest
              volumeMounts:
                - mountPath: /podcasts
                  name: zgrzyt-podcasts
              envFrom:
                - configMapRef:
                    name: zgrzyt-download-newest-config
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
          imagePullSecrets:
            - name: ghcr-secret
          volumes:
            - name: zgrzyt-podcasts
              persistentVolumeClaim:
                claimName: zgrzyt-podcasts
          restartPolicy: OnFailure
