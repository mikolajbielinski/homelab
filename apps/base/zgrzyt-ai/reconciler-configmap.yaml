apiVersion: v1
kind: ConfigMap
metadata:
  name: zgrzyt-reconciler-script
data:
  reconcile.sh: |
    #!/bin/sh
    set -eu

    echo "=== reconciler start: $(date -u +%FT%TZ) ==="
    echo "Files on PVC: $(ls /podcasts/*.mp3 2>/dev/null | wc -l)"

    RECENT=$(find /podcasts -maxdepth 1 -name '*.mp3' -mmin -20 -printf '--exclude=%f ')
    if [ -n "$RECENT" ]; then
        echo "Skipping recent files (ffmpeg may still be writing them): $RECENT"
    fi

    aws s3 sync /podcasts s3://zgrzyt-ai/mp3/ \
        --exclude '*' --include '*.mp3' $RECENT \
        --no-progress

    echo "=== reconciler end: $(date -u +%FT%TZ) ==="
