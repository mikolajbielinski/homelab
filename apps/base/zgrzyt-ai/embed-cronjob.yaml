apiVersion: batch/v1
kind: CronJob
metadata:
  name: zgrzyt-embed
spec:
  schedule: '@hourly'
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      name: zgrzyt-embed
    spec:
      ttlSecondsAfterFinished: 172800
      activeDeadlineSeconds: 7200
      backoffLimit: 2
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: zgrzyt-embed
              image: ghcr.io/mikolajbielinski/zgrzyt-embed:main@sha256:e053129fb39115b0e03e58b917a8a894876b0257aa9e642bc9a3336184133503
              envFrom:
                - configMapRef:
                    name: zgrzyt-embed-config
                - secretRef:
                    name: embed-aws-secret
                - secretRef:
                    name: openai-secret
              resources:
                requests:
                  cpu: 25m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
          imagePullSecrets:
            - name: ghcr-secret
          restartPolicy: Never
