apiVersion: batch/v1
kind: CronJob
metadata:
  name: zgrzyt-embed
spec:
  schedule: '@hourly'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      name: zgrzyt-embed
    spec:
      template:
        spec:
          containers:
            - name: zgrzyt-embed
              image: ghcr.io/mikolajbielinski/zgrzyt-embed:main@sha256:005348018d38f6d42d9564eb135692aff6016d39d70b3e8eccd449e77d06459a
              envFrom:
                - configMapRef:
                    name: zgrzyt-embed-config
                - secretRef:
                    name: embed-aws-secret
                - secretRef:
                    name: openai-secret
          imagePullSecrets:
            - name: ghcr-secret
          restartPolicy: OnFailure
