apiVersion: batch/v1
kind: CronJob
metadata:
  name: zgrzyt-embed
spec:
  schedule: '@hourly'
  # PAUZA: wstrzymane do czasu uzyskania zgod osob wystepujacych w podcascie.
  # Bez tego embed wrzuca transkrypty (dane osob) do Qdranta. Zdejmij po podpisaniu zgod.
  suspend: true
  jobTemplate:
    metadata:
      name: zgrzyt-embed
    spec:
      template:
        spec:
          containers:
            - name: zgrzyt-embed
              image: ghcr.io/mikolajbielinski/zgrzyt-embed:latest
              envFrom:
                - configMapRef:
                    name: zgrzyt-embed-config
                - secretRef:
                    name: aws-secret
                - secretRef:
                    name: openai-secret
          imagePullSecrets:
            - name: ghcr-secret
          restartPolicy: OnFailure
