apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-config
data:
  run-backup.bash: |
    #!/bin/bash
    set -euo pipefail

    backup_dir="${BACKUP_DIR:?}/linkding"
    backup_file="backup_$(date '+%Y-%m-%d_%H-%M-%S').zip"

    mkdir -p "${backup_dir}"

    tmp_file="${backup_dir}/.${backup_file}.partial"
    trap 'rm -f "${tmp_file}"' EXIT

    python manage.py full_backup "${tmp_file}"
    mv "${tmp_file}" "${backup_dir}/${backup_file}"

    echo "Backup written to ${backup_dir}/${backup_file}"
