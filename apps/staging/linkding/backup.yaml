apiVersion: batch/v1
kind: CronJob
metadata:
  name: linkding-backup
spec:
  schedule: 0 5 * * *
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 172800
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 33
            runAsGroup: 33
            runAsNonRoot: true
            runAsUser: 33
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - image: sissbruecker/linkding:1.47.0
              name: linkding-backup
              command:
                - /bin/bash
                - /tmp/scripts/run-backup.bash
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              env:
                - name: BACKUP_DIR
                  value: /transfer
              volumeMounts:
                - mountPath: /etc/linkding/data
                  name: linkding-data
                - mountPath: /tmp/scripts
                  name: scripts
                - mountPath: /transfer
                  name: transfer-volume
          containers:
            - image: rclone/rclone:1.75.1
              name: transfer-backup
              command:
                - rclone
              args:
                - copy
                - /transfer/linkding
                - :sftp:/upload
                - --sftp-host=sftp-svc.backups.svc.cluster.local
                - --sftp-user=linkding
                - --sftp-port=22
                - --sftp-key-file=/etc/sftp-client/key/sftp-private-key
                - --sftp-known-hosts-file=/etc/sftp-client/hosts/known_hosts
                - --sftp-host-key-algorithms=ssh-ed25519
                - --sftp-shell-type=none
                - --verbose
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - mountPath: /transfer
                  name: transfer-volume
                  readOnly: true
                - name: sftp-private-key
                  mountPath: /etc/sftp-client/key
                  readOnly: true
                - name: known-hosts
                  mountPath: /etc/sftp-client/hosts
                  readOnly: true
          restartPolicy: Never
          volumes:
            - name: linkding-data
              persistentVolumeClaim:
                claimName: linkding-data
            - name: scripts
              configMap:
                name: backup-config
            - name: transfer-volume
              emptyDir:
                sizeLimit: 1Gi
            - name: sftp-private-key
              secret:
                secretName: sftp-private-key
                defaultMode: 0440
            - name: known-hosts
              configMap:
                name: sftp-known-hosts
