name: Validate homelab

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
        with:
          version: 2.9.5

      - name: Build manifests
        run: |
          flux build kustomization flux-system \
            --path ./clusters/staging \
            --kustomization-file ./clusters/staging/flux-system/gotk-sync.yaml \
            --local-sources GitRepository/flux-system/flux-system=. \
            --recursive \
            --dry-run \
            > rendered.yaml

      - name: Validate manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
        with:
          entrypoint: /kubeconform
          args: "-strict -ignore-missing-schemas -skip Secret -summary rendered.yaml"

  terraform-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.discover.outputs.projects }}
      terraform-version: ${{ steps.version.outputs.terraform-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Terraform version
        id: version
        run: echo "terraform-version=$(<.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Discover Terraform projects
        id: discover
        run: |
          projects=$(find infrastructure/terraform -type f -name '*.tf' -printf '%h\n' | sort -u | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  terraform:
    needs: terraform-projects
    name: Terraform (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.terraform-projects.outputs.projects) }}
    env:
      TF_PROJECT: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ needs.terraform-projects.outputs.terraform-version }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir="$TF_PROJECT" fmt -check

      - name: Initialize
        run: terraform -chdir="$TF_PROJECT" init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform -chdir="$TF_PROJECT" validate

      - name: Test worker scripts
        run: |
          if [ -d "$TF_PROJECT/tests" ]; then
            python3 -m unittest discover -s "$TF_PROJECT/tests" -p 'test_*.py'
          fi

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Install YAML parser
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Test SOPS checker
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Check SOPS encryption
        run: python .github/scripts/check_sops.py

      - name: Scan for leaked credentials
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  ci-ok:
    needs: [manifests, terraform-projects, terraform, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job
        run: |
          manifests_success=${{ needs.manifests.result == 'success' || needs.manifests.result == 'skipped' }}
          terraform_projects_success=${{ needs.terraform-projects.result == 'success' || needs.terraform-projects.result == 'skipped' }}
          terraform_success=${{ needs.terraform.result == 'success' || needs.terraform.result == 'skipped' }}
          secrets_success=${{ needs.secrets.result == 'success' || needs.secrets.result == 'skipped' }}
          if [ "$manifests_success" = "true" ] && \
            [ "$terraform_projects_success" = "true" ] && \
            [ "$terraform_success" = "true" ] && \
            [ "$secrets_success" = "true" ]; then
            exit 0
          else
            exit 1
          fi
