apiVersion: batch/v1
kind: CronJob
metadata:
  name: k3s-backup
spec:
  schedule: 0 3 * * *
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 2
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: k3s-backup
              image: python:3.14-alpine@sha256:016508ba505da24f7139765bc4bb669df4e88eb2f12eeadd571bf2f88d7533df
              command:
                - python3
                - /scripts/run-backup.py
              env:
                - name: BACKUP_DIR
                  value: /backups/k3s/upload
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: SQLITE_TMPDIR
                  value: /work
                - name: TMPDIR
                  value: /work
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsUser: 0
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: k3s-db
                  mountPath: /host/k3s-db
                  readOnly: true
                - name: k3s-token
                  mountPath: /host/k3s-token
                  readOnly: true
                - name: k3s-config
                  mountPath: /host/k3s-config
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
          restartPolicy: Never
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: backups
            - name: k3s-db
              hostPath:
                path: /var/lib/rancher/k3s/server/db
                type: Directory
            - name: k3s-token
              hostPath:
                path: /var/lib/rancher/k3s/server/token
                type: File
            - name: k3s-config
              hostPath:
                path: /etc/rancher/k3s
                type: Directory
            - name: scripts
              configMap:
                name: k3s-backup-config
                defaultMode: 0555
            - name: work
              emptyDir:
                sizeLimit: 2Gi
