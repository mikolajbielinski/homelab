apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sftp-server
  name: sftp-server
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sftp-server
  strategy: {}
  template:
    metadata:
      labels:
        app: sftp-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-home-permissions
          image: atmoz/sftp@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475
          volumeMounts:
            - name: backup-storage
              mountPath: /home
          command:
            - chmod
            - "755"
            - /home
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - image: atmoz/sftp@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475
          name: sftp
          ports:
            - name: sftp
              containerPort: 22
          livenessProbe:
            tcpSocket:
              port: sftp
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: sftp
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            tcpSocket:
              port: sftp
            failureThreshold: 18
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: backup-storage
              mountPath: /home
            - name: host-ssh-pk
              mountPath: /etc/ssh/ssh_host_ed25519_key
              subPath: ssh_host_ed25519_key
              readOnly: true
            - name: users-config
              mountPath: /etc/sftp/users.conf
              subPath: users.conf
              readOnly: true

            - name: linkding-public-key
              mountPath: /home/linkding/.ssh/keys
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
      volumes:
        - name: backup-storage
          persistentVolumeClaim:
            claimName: backups
        - name: host-ssh-pk
          secret:
            secretName: sftp-ssh-pk
            defaultMode: 0600
        - name: users-config
          configMap:
            name: users-config
        - name: linkding-public-key
          configMap:
            name: users-ssh-public-keys
            items:
              - key: linkding-sftp.pub
                path: linkding-sftp.pub
